<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta
          name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>Solitaire: Visual People Database</title>
  <link rel="stylesheet" href="./brand-specific/brand.css">
  <link rel="stylesheet" href="./css/search-bar.css">
  <link rel="stylesheet" href="./css/solitaire-styles.css">
  <link rel="icon" type="image/svg+xml" href="assets/solitaire.svg">
  <style>
    #app-spinner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:99999;background:#fff;transition:opacity .35s ease}
    html[data-theme="dark"] #app-spinner{background:#111217}
    #app-spinner.is-hidden{opacity:0;pointer-events:none}
    .app-spinner__ring{width:40px;height:40px;border:3px solid rgba(0,0,0,.1);border-top-color:#888;border-radius:50%;animation:_spin .75s linear infinite}
    html[data-theme="dark"] .app-spinner__ring{border-color:rgba(255,255,255,.1);border-top-color:#aaa}
    @keyframes _spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="app-spinner" aria-hidden="true"><div class="app-spinner__ring"></div></div>

<div id="side-overlay" tabindex="-1"></div>

<aside id="side-drawer" aria-hidden="true" aria-labelledby="side-title" role="dialog">
  <div class="drawer-panels">

    <div class="drawer-panel drawer-panel--main">
      <header class="drawer-header">
        <h1>♤ Solitaire: Visual People Database</h1>
        <button id="side-close" class="drawer-icon-btn" aria-label="Close">×</button>
      </header>
      <nav class="content">
        <ul class="actions">
          <li><button id="act-about">ℹ️ About</button></li>
          <li><button id="act-upload">📤 Upload CSV</button></li>
          <li><button id="act-legend">🎨 Legenda ›</button></li>
          <li><button id="act-scenario">🖥️ Display ›</button></li>
          <li><button id="act-scenario-mgr">🗂️ Scenario ›</button></li>
          <li><button id="act-report">📝 Report a change</button></li>
          <li><button id="act-switch" onclick="window.location.href='./domino.html'">⚅ Domino</button></li>
          <li><button id="act-switch-hub" onclick="window.location.href='./index.html'">🏠 Portfolio Index</button></li>
        </ul>
      </nav>
      <footer class="drawer-footer">
        <small id="side-last-update"></small>
        <small id="build-info" style="opacity:0.55;display:block;margin-top:2px"></small>
      </footer>
    </div>

    <div class="drawer-panel drawer-panel--sub">
      <header class="drawer-header">
        <button id="sub-back" class="drawer-icon-btn" aria-label="Back">‹</button>
        <h1 id="sub-drawer-title"></h1>
        <button id="sub-close" class="drawer-icon-btn" aria-label="Close">×</button>
      </header>
      <nav class="content">
        <ul id="sub-content-legend" class="actions" style="display:none">
          <li>
            <label class="switch-label">
              🎨 Role
              <input type="radio" name="legend-mode" id="toggle-color-role" checked>
              <span class="slider"></span>
            </label>
          </li>
          <li>
            <label class="switch-label">
              🏢 Company
              <input type="radio" name="legend-mode" id="toggle-color-company">
              <span class="slider"></span>
            </label>
          </li>
          <li>
            <label class="switch-label">
              📍 Location
              <input type="radio" name="legend-mode" id="toggle-color-location">
              <span class="slider"></span>
            </label>
          </li>
          <li>
            <label class="switch-label">
              🏗️ Function
              <input type="radio" name="legend-mode" id="toggle-color-function">
              <span class="slider"></span>
            </label>
          </li>
        </ul>
        <ul id="sub-content-display" class="actions" style="display:none">
          <li><button id="act-fit">↺ Fit to content</button></li>
          <li><button id="act-collapse-all">⬆ Collapse All Streams</button></li>
          <li><button id="act-expand-all">⬇ Expand All Streams</button></li>
          <li><hr style="border:none;border-top:1px solid #ddd;margin:4px 0"></li>
          <li>
            <label class="switch-label">
              🌙 Dark Mode
              <input type="checkbox" id="toggle-dark-mode">
              <span class="slider"></span>
            </label>
          </li>
        </ul>
        <ul id="sub-content-scenario" class="actions" style="display:none">
          <li><button id="act-scenario-save">💾 Save Scenario</button></li>
          <li><button id="act-scenario-import">📥 Import Scenario</button></li>
          <li><button id="act-scenario-export">📤 Export Scenario</button></li>
          <li><button id="act-scenario-reset">♻️ Reset Scenario</button></li>
        </ul>
      </nav>
    </div>

  </div>
</aside>

<div class="top-bar">
  <div class="top-bar__row top-bar__row--search">
    <button class="top-bar__hamburger" id="toggle-cta" aria-label="Menu">☰</button>
    <div class="top-search">
      <button class="top-search__icon" id="drawer-search-go" title="Search" aria-label="Search">🔍</button>
      <div class="search-field" id="search-field">
        <input type="text" id="drawer-search-input" placeholder='Search by name or fields (e.g. role:Developer or role:"Product Developer"). Suggestions appear as you type.' />
      </div>
      <button class="top-search__clear" id="act-clear" title="Clear search" aria-label="Clear search">✕</button>
    </div>
    <div id="qf-filters-btn-slot"></div>
  </div>
  <div class="top-bar__row top-bar__row--filters" id="quick-filters-bar"></div>
</div>

<label for="fileInput" id="label-file" class="custom-file-upload">
  <input type="file" id="fileInput" accept=".csv" class="file-input" />
  Upload a CSV People DB
</label>
<div id="output"></div>
<svg id="canvas"></svg>

<div id="drawer-overlay"></div>

<aside id="drawer" aria-hidden="true" aria-labelledby="drawer-title" role="dialog">
  <header>
    <h3 id="drawer-title">Managed Services</h3>
    <button id="drawer-close" aria-label="Chiudi" data-tooltip="Close">×</button>
  </header>
  <div class="content">
    <p id="drawer-description" class="drawer-description"></p>
    <ul id="drawer-list"></ul>
  </div>
</aside>

<div id="person-drawer-overlay"></div>
<aside id="person-drawer" aria-hidden="true" aria-labelledby="person-drawer-title" role="dialog">
  <div class="person-drawer-panels">
    <div class="person-drawer-panel person-drawer-panel--l1">
      <header class="person-drawer-header">
        <h3 id="person-drawer-title"></h3>
        <button id="person-drawer-link" class="drawer-icon-btn" aria-label="Copy person link" data-tooltip="Copy link"><svg width="15" height="15" viewBox="-8 -8 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M 2.5 -6 L -4 -6 Q -6 -6 -6 -4 L -6 4 Q -6 6 -4 6 L 4 6 Q 6 6 6 4 L 6 -2.5 M -1 1 L 5.5 -5.5 M 5.5 -5.5 L 5.5 -3 M 5.5 -5.5 L 3 -5.5"/></svg></button>
        <button id="person-drawer-close" class="drawer-icon-btn" aria-label="Close" data-tooltip="Close">×</button>
      </header>
      <div id="person-drawer-content" class="person-drawer-content"></div>
    </div>
    <div class="person-drawer-panel person-drawer-panel--l2">
      <header class="person-drawer-header">
        <button id="person-drawer-back" class="drawer-icon-btn drawer-back-btn" aria-label="Back" data-tooltip="Back">‹</button>
        <h3 id="person-drawer-l2-title"></h3>
        <button id="person-drawer-l2-close" class="drawer-icon-btn" aria-label="Close" data-tooltip="Close">×</button>
      </header>
      <div id="person-drawer-l2-content" class="person-drawer-content"></div>
    </div>
  </div>
</aside>

<footer>
  <svg id="brand-logo"></svg>
  <p>Digital Service Management</p>
</footer>

</body>
</html>
