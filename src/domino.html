<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domino: Digital Service Catalog</title>
    <link rel="stylesheet" href="./brand-specific/brand.css">
    <link rel="stylesheet" href="./css/search-bar.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/domino.svg">
    <style>
        #app-spinner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:99999;background:#fff;transition:opacity .35s ease}
        html[data-theme="dark"] #app-spinner{background:#111217}
        #app-spinner.is-hidden{opacity:0;pointer-events:none}
        .app-spinner__ring{width:40px;height:40px;border:3px solid rgba(0,0,0,.1);border-top-color:#888;border-radius:50%;animation:_spin .75s linear infinite}
        html[data-theme="dark"] .app-spinner__ring{border-color:rgba(255,255,255,.1);border-top-color:#aaa}
        @keyframes _spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
<div id="app-spinner" aria-hidden="true"><div class="app-spinner__ring"></div></div>

<div id="side-overlay" tabindex="-1"></div>

<aside id="side-drawer" aria-hidden="true" aria-labelledby="side-title" role="dialog">
    <div class="drawer-panels">

        <div class="drawer-panel drawer-panel--main">
            <header class="drawer-header">
                <h1>Domino ⚅ Dependency Mapping Visualization Tool</h1>
                <button id="side-close" class="drawer-icon-btn" aria-label="Close">×</button>
            </header>
            <nav class="content">
                <ul class="actions">
                    <li><button id="act-about">ℹ️ About</button></li>
                    <li><button id="act-upload">📤 Upload CSV</button></li>
                    <li><button id="act-fit">↺ Fit to content</button></li>
                    <li><button id="act-display-settings">⚙️ Display Settings ›</button></li>
                    <li><button id="act-introduce">➕ Introduce New Service</button></li>
                    <li><button id="act-update">✏️ Update Service Info</button></li>
                    <li><button id="act-switch" onclick="window.location.href='./solitaire.html'">♤ Solitaire</button></li>
                    <li><button id="act-switch-hub" onclick="window.location.href='./index.html'">🏠 Portfolio Index</button></li>
                </ul>
            </nav>
            <footer class="drawer-footer">
                <small id="side-last-update"></small>
                <small id="build-info" style="opacity:0.55;display:block;margin-top:2px"></small>
            </footer>
        </div>

        <div class="drawer-panel drawer-panel--sub">
            <header class="drawer-header">
                <button id="sub-back" class="drawer-icon-btn" aria-label="Back">‹</button>
                <h1 id="sub-drawer-title">Display Settings</h1>
                <button id="sub-close" class="drawer-icon-btn" aria-label="Close">×</button>
            </header>
            <nav class="content">
                <ul class="actions">
                    <li>
                        <label class="switch-label">
                            🚫 Show Decommissioned
                            <input type="checkbox" id="toggle-decommissioned">
                            <span class="slider"></span>
                        </label>
                    </li>
                    <li>
                        <label class="switch-label">
                            🎛️ Relaxed Search
                            <input type="checkbox" id="relaxed-search">
                            <span class="slider"></span>
                        </label>
                    </li>
                    <li>
                        <label class="switch-label">
                            🔗 Show Connections
                            <input type="checkbox" id="toggle-show-connections" checked>
                            <span class="slider"></span>
                        </label>
                    </li>
                    <li>
                        <label class="switch-label">
                            🔄 Readjust Positions
                            <input type="checkbox" id="toggle-readjust-positions">
                            <span class="slider"></span>
                        </label>
                    </li>
                    <li>
                        <label class="switch-label">
                            🌙 Dark Mode
                            <input type="checkbox" id="toggle-dark-mode">
                            <span class="slider"></span>
                        </label>
                    </li>
                </ul>
            </nav>
        </div>

    </div>
</aside>

<div class="top-bar">
    <div class="top-bar__row top-bar__row--search">
        <button class="top-bar__hamburger" id="toggle-cta" aria-label="Menu">☰</button>
        <div class="top-search">
            <button class="top-search__icon" id="drawer-search-go" title="Search" aria-label="Search">🔍</button>
            <div class="search-field" id="search-field">
                <input type="text" id="drawer-search-input" placeholder='Search… (field:"value" | field:value | value)' />
            </div>
            <button class="top-search__clear" id="act-clear" title="Clear search" aria-label="Clear search">✕</button>
        </div>
        <button class="top-bar__action" id="view-list" title="List view">📋</button>
        <button class="top-bar__action" id="view-graph" title="Graph view" style="display:none;">🕸️</button>
        <button class="top-bar__action" id="act-export-excel" title="Export to Excel" style="display:none;">📥</button>
    </div>
</div>

<label id="label-file" class="custom-file-upload">
    <input type="file" id="fileInput" accept=".csv" class="file-input" />
    Select the CSV
</label>

<div id="map"></div>
<div id="list-view" class="list-view" style="display:none;"></div>
<div class="tooltip" id="tooltip" style="opacity: 0;"></div>
<div id="legend" class="legend"></div>

<div id="overlay" class="overlay"></div>

<div id="drawer" class="drawer">
    <div class="drawer-header">
        <h2>Service Information</h2>
        <button class="close-drawer" id="closeDrawer" data-tooltip="Close">✖</button>
    </div>
    <div id="drawerContent" class="drawer-content"></div>
</div>


<div id="export-modal" class="export-modal-backdrop" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="export-modal-title">
    <div class="modal-box export-modal-box">
        <h3 id="export-modal-title">Export to Excel</h3>
        <p>Choose which columns to include:</p>
        <button id="export-visible-cols">Visible columns only</button>
        <button id="export-all-cols">All columns</button>
        <button id="export-cancel" class="export-cancel">Cancel</button>
    </div>
</div>

<footer>
    <svg id="brand-logo"></svg>
    <p>Digital Service Management</p>
</footer>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</body>
</html>
